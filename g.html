<main>
    <h1>Items</h1>
    <p class="subtitle" id="gameCount">Showing all # items</p>
    <input type="text" id="searchInput" placeholder="Search items..." class="search-bar">

    <div class="game-grid" id="gameGrid">
    </div>
</main>

    <script>
    function openIframe(url) {
        const w = window.open("about:blank");
        if (!w) { alert("Popup blocked!"); return; }
    
        const d = w.document;
        d.documentElement.style.margin = "0";
        d.documentElement.style.padding = "0";
        d.body.style.margin = "0";
        d.body.style.padding = "0";
        d.body.style.height = "100%";
        d.body.style.overflow = "hidden";
    
        const iframe = d.createElement("iframe");
        iframe.src = url;
        iframe.style.width = "100vw";
        iframe.style.height = "100vh";
        iframe.style.border = "none";
    
        d.body.appendChild(iframe);
    }
    </script>
    
<script>
const games = [
    { name: "retro bowl", thumbnail: "cdn/retrobowl/img/icon.jpg", url: "iframe.html?url=/cdn/retrobowl/index.html" }, //need image
    { name: "geometry dash", thumbnail: "/cdn/gdlite/logo.png", url: "iframe.html?url=/cdn/gdlite/index.html" }, //need image
    { name: "bitlife", thumbnail: "/cdn/bitlife/logo.png", url: "iframe.html?url=/cdn/bitlife/index.html" }, //need image
    { name: "motox3m", thumbnail: "null", url: "iframe.html?url=/cdn/motox3m/index.html" },
    { name: "motox3mpool", thumbnail: "null", url: "iframe.html?url=/cdn/motox3mpool/index.html" }, //need image
    { name: "motox3mspooky", thumbnail: "null/", url: "iframe.html?url=/cdn/motox3mspooky/index.html" }, //need image
    { name: "motox3mwinter", thumbnail: "null", url: "iframe.html?url=/cdn/motox3mwinter/index.html" }, //need image
    { name: "2048", thumbnail: "null", url: "iframe.html?url=/cdn/2048/index.html" },  //need image
];

const gameGrid = document.getElementById('gameGrid');
const gameCount = document.getElementById('gameCount');
const searchInput = document.getElementById('searchInput');

games.forEach(game => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.innerHTML = `
        <a href="${game.url}" class="game-link">
            <img src="${game.thumbnail}" alt="${game.name}" class="game-thumb">
            <span class="game-name">${game.name}</span>
        </a>
    `;
    card.dataset.name = game.name.toLowerCase(); 
    gameGrid.appendChild(card);
});

gameCount.textContent = `Showing ${games.length} items`;

let debounceTimer;
searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
        const term = searchInput.value.toLowerCase();
        const visibleCards = Array.from(gameGrid.children).filter(card => {
            const match = card.dataset.name.includes(term);
            card.style.display = match ? '' : 'none';
            return match;
        });
        gameCount.textContent = `Showing ${visibleCards.length} items`;
    }, 150);
});
</script>
